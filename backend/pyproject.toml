[project]
name = "stockwise"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aio-pika>=10.2.3",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "psycopg>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "redis>=8.1.0",
    "ruff>=0.17.5",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E4", # Ошибки импосртов
    "E7", # Ошибки конструкций Python
    "E9", # Серьёзные ошибки синтаксиса
    "F", # Неиспользуемые импорты, неопределённые имена и другое
    "I", # Сотртировка импортов
    "UP", # Воременный синтаксис
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true