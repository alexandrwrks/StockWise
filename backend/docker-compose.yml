services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock_wise_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../frontend:/frontend:ro
    env_file:
      - .env.docker
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  database:
    image: postgres:17
    container_name: stock_wise_database
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 3s
      timeout: 3s
      retries: 3
    env_file:
      - .env.docker
    ports:
      - "5433:5432"
    volumes:
      - database:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run alembic upgrade head
    env_file:
      - .env.docker
    depends_on:
      database:
        condition: service_healthy

volumes:
  database:
