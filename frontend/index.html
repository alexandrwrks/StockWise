<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StockWise - ингредиенты</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <button id="open-modal" type="button">Добавить ингредиент</button>

    <dialog id="ingredient-modal" aria-labelledby="modal-title">
        <h2 id="modal-title">Новый ингредиент</h2>

        <form id="ingredient-form">
            <label>
                Название
                <input name="name" required maxlength="150" autofocus>
            </label>

            <label>
                Артикул
                <input name="sku" required maxlength="50">
            </label>

            <label>
                Единица измерения
                <select name="unit" required>
                    <option value="">Выберите единицу</option>
                    <option value="ml">Миллилитры</option>
                    <option value="gr">Грамм</option>
                    <option value="pcs">Штук</option>
                </select>
            </label>

            <label>
                Минимальный остаток
                <input
                    name="minimum_stock"
                    type="number"
                    min="0"
                    step="0.001"
                    required
                >
            </label>

            <label>
                Начальный остаток
                <input
                    name="current_stock"
                    type="number"
                    min="0"
                    step="0.001"
                    value="0"
                    required
                >
            </label>

            <label>
                Срок поставки в днях
                <input
                    name="reorder_lead_time_days"
                    type="number"
                    min="0"
                    step="1"
                    required
                >
            </label>

            <div class="actions">
                <button id="close-modal" type="button">Отмена</button>
                <button type="submit">Создать</button>
            </div>
        </form>
    </dialog>
</body>
</html>
